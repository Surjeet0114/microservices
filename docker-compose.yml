services:

  # Discovery Server (Eureka)
  discoveryserver:
    image: discoveryserver:latest
    container_name: discoveryserver
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - microservice-network

  # Config Server
  configserver:
    image: configserver:latest
    container_name: configserver
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      EUREKA_SERVER_URL: http://discoveryserver:8761/eureka/
    depends_on:
      discoveryserver:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - microservice-network

  # Kafka
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    networks:
      - microservice-network

  # Product Service
  productservice:
    image: productservice:latest
    container_name: productservice
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER_URL: http://configserver:8888
      EUREKA_SERVER_URL: http://discoveryserver:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      discoveryserver:
        condition: service_started
      configserver:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - microservice-network

  # Order Service
  orderservice:
    image: orderservice:latest
    container_name: orderservice
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_URL: http://configserver:8888
      EUREKA_SERVER_URL: http://discoveryserver:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      discoveryserver:
        condition: service_started
      configserver:
        condition: service_healthy
      productservice:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - microservice-network

  # Payment Service
  paymentservice:
    image: paymentservice:latest
    container_name: paymentservice
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      CONFIG_SERVER_URL: http://configserver:8888
      EUREKA_SERVER_URL: http://discoveryserver:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      discoveryserver:
        condition: service_started
      configserver:
        condition: service_healthy
      kafka:
        condition: service_started
      orderservice:
        condition: service_started
    networks:
      - microservice-network

  # API Gateway
  apigateway:
    image: apigateway:latest
    container_name: apigateway
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      CONFIG_SERVER_URL: http://configserver:8888
      EUREKA_SERVER_URL: http://discoveryserver:8761/eureka/
    depends_on:
      discoveryserver:
        condition: service_started
      configserver:
        condition: service_healthy
      productservice:
        condition: service_started
      orderservice:
        condition: service_started
      paymentservice:
        condition: service_started
    networks:
      - microservice-network

# Shared Network
networks:
  microservice-network:
    driver: bridge
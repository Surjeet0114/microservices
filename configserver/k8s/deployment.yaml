apiVersion: apps/v1
kind: Deployment

metadata:
  name: configserver-deployment
  namespace: microservices

spec:
  replicas: 1

  selector:
    matchLabels:
      app: configserver

  template:
    metadata:
      labels:
        app: configserver

    spec:
      containers:
        - name: configserver-container
          image: configserver:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8888

          envFrom:
            - configMapRef:
                name: microservices-config

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8888
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8888
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8888
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
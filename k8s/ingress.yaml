apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: microservices-ingress
  namespace: microservices

spec:
  ingressClassName: nginx

  rules:
    - host: microservices.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: apigateway
                port:
                  number: 8080
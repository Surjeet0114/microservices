apiVersion: apps/v1
kind: Deployment

metadata:
  name: configserver-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: configserver

  template:
    metadata:
      labels:
        app: configserver

    spec:
      containers:
        - name: configserver-container
          image: configserver:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8888

          env:
            - name: EUREKA_SERVER_URL
              value: http://discoveryserver:8761/eureka/
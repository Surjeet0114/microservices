apiVersion: apps/v1
kind: Deployment

metadata:
  name: discoveryserver-deployment
  namespace: microservices

spec:
  replicas: 1

  selector:
    matchLabels:
      app: discoveryserver

  template:
    metadata:
      labels:
        app: discoveryserver

    spec:
      containers:
        - name: discoveryserver-container
          image: discoveryserver:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8761

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"